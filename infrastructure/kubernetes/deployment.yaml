apiVersion: apps/v1
kind: Deployment
metadata:
  name: judge-api
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels: {app: judge-api}
  template:
    metadata:
      labels: {app: judge-api}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: judge-api
          image: online-judge-api:0.1.0-SNAPSHOT
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 8080}
          envFrom:
            - configMapRef: {name: judge-api}
          env:
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: judge-api-secrets, key: postgres-password}}
            - name: REDIS_PASSWORD
              valueFrom: {secretKeyRef: {name: judge-api-secrets, key: redis-password}}
            - name: S3_ACCESS_KEY
              valueFrom: {secretKeyRef: {name: judge-api-secrets, key: s3-access-key}}
            - name: S3_SECRET_KEY
              valueFrom: {secretKeyRef: {name: judge-api-secrets, key: s3-secret-key}}
            - name: JWT_PRIVATE_KEY_BASE64
              valueFrom: {secretKeyRef: {name: judge-api-secrets, key: jwt-private-key-base64, optional: true}}
            - name: JWT_PUBLIC_KEY_BASE64
              valueFrom: {secretKeyRef: {name: judge-api-secrets, key: jwt-public-key-base64, optional: true}}
            - name: PORTAL_CLIENT_SECRET
              valueFrom: {secretKeyRef: {name: judge-api-secrets, key: portal-client-secret, optional: true}}
            - name: JUDGE_WORKER_TOKEN
              valueFrom: {secretKeyRef: {name: judge-api-secrets, key: judge-worker-token, optional: true}}
          resources:
            requests: {cpu: 250m, memory: 512Mi, ephemeral-storage: 256Mi}
            limits: {cpu: "2", memory: 1Gi, ephemeral-storage: 1Gi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
          startupProbe:
            httpGet: {path: /actuator/health/liveness, port: http}
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet: {path: /actuator/health/liveness, port: http}
            periodSeconds: 15
            timeoutSeconds: 3
          readinessProbe:
            httpGet: {path: /actuator/health/readiness, port: http}
            periodSeconds: 10
            timeoutSeconds: 15
            failureThreshold: 3
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 512Mi}

