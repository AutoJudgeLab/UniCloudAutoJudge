spring:
  application:
    name: judge-worker
  main:
    web-application-type: none
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      username: ${REDIS_USERNAME:}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:2s}
      # Must stay well above judge.worker.block-timeout: XREADGROUP blocks on the shared connection.
      timeout: ${WORKER_REDIS_COMMAND_TIMEOUT:10s}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:false}

judge:
  worker:
    stream: ${REDIS_SUBMISSION_STREAM:judge:submissions:v1}
    dead-letter-stream: ${WORKER_DEAD_LETTER_STREAM:judge:submissions:dead:v1}
    group: ${WORKER_GROUP:judge-workers}
    consumer-name: ${WORKER_CONSUMER_NAME:${HOSTNAME:${COMPUTERNAME:worker-1}}}
    concurrency: ${WORKER_CONCURRENCY:2}
    max-deliveries: ${WORKER_MAX_DELIVERIES:5}
    block-timeout: ${WORKER_BLOCK_TIMEOUT:2s}
    # Live deliveries refresh their idle time every third of this interval.
    reclaim-idle: ${WORKER_RECLAIM_IDLE:5m}
    shutdown-grace: ${WORKER_SHUTDOWN_GRACE:2m}
    api:
      base-url: ${JUDGE_API_BASE_URL:http://localhost:8080}
      token: ${JUDGE_WORKER_TOKEN}
      connect-timeout: ${WORKER_API_CONNECT_TIMEOUT:5s}
      request-timeout: ${WORKER_API_REQUEST_TIMEOUT:30s}
    limits:
      # Used when the job does not carry its own limits (assignments have no limit fields today).
      time-limit: ${WORKER_TIME_LIMIT:5s}
      memory-mb: ${WORKER_MEMORY_MB:256}
      compile-time-limit: ${WORKER_COMPILE_TIME_LIMIT:30s}
      compile-memory-mb: ${WORKER_COMPILE_MEMORY_MB:512}
      max-output-bytes: ${WORKER_MAX_OUTPUT_BYTES:1048576}
      stored-output-bytes: ${WORKER_STORED_OUTPUT_BYTES:16384}
    sandbox:
      docker-binary: ${WORKER_DOCKER_BINARY:docker}
      cpus: ${WORKER_SANDBOX_CPUS:1.0}
      pids-limit: ${WORKER_SANDBOX_PIDS:128}
      tmpfs-mb: ${WORKER_SANDBOX_TMPFS_MB:64}
      workspace-bytes: ${WORKER_WORKSPACE_BYTES:536870912}
      workspace-files: ${WORKER_WORKSPACE_FILES:10000}
      # Container start-up is outside the student's control, so it is not counted against the time limit.
      startup-grace: ${WORKER_SANDBOX_STARTUP_GRACE:2s}
    languages:
      enabled: ${WORKER_LANGUAGES:JAVA,PYTHON,C,CPP,JAVASCRIPT,TYPESCRIPT,KOTLIN,GO,RUST,CSHARP}
      java-image: ${WORKER_JAVA_IMAGE:eclipse-temurin:21-jdk}
      python-image: ${WORKER_PYTHON_IMAGE:python:3.13-slim}
      gcc-image: ${WORKER_GCC_IMAGE:gcc:14}
      node-image: ${WORKER_NODE_IMAGE:node:22-bookworm-slim}
      typescript-image: ${WORKER_TYPESCRIPT_IMAGE:judge-typescript:5.8.3}
      kotlin-image: ${WORKER_KOTLIN_IMAGE:judge-kotlin:2.1.20}
      go-image: ${WORKER_GO_IMAGE:golang:1.24-bookworm}
      rust-image: ${WORKER_RUST_IMAGE:rust:1.85-bookworm}
      csharp-image: ${WORKER_CSHARP_IMAGE:mcr.microsoft.com/dotnet/sdk:8.0}
